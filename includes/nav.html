<!-- Barra de navegación -->
<header class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="index.html" class="logo">
      <img src="img/vivae.jpg" alt="Vivae Logo" class="logo-img">
    </a>

    <!-- Botón de menú móvil -->
    <button class="menu-toggle" id="menuToggle" aria-label="Menú" aria-expanded="false" aria-controls="mainNav">
      <span class="hamburger"></span>
      <span class="hamburger"></span>
      <span class="hamburger"></span>
      <span class="sr-only">Menú</span>
    </button>

    <!-- Overlay para cerrar el menú -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Menú de navegación principal -->
    <nav class="main-nav" id="mainNav" aria-label="Navegación principal">
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-active="inicio">INICIO</a></li>
        <li><a href="productos.html" class="nav-link" data-active="productos">PRODUCTOS</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- Script para manejar el estado activo de los enlaces -->
<script>
  // Actualizar el enlace activo según la página actual
  document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
      const linkHref = link.getAttribute('href');
      if (currentPage === linkHref || 
          (currentPage === '' && linkHref === 'index.html') ||
          (currentPage.includes('producto') && linkHref === 'productos.html')) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      } else {
        link.classList.remove('active');
        link.removeAttribute('aria-current');
      }
    });
  });
</script>
