<!DOCTYPE html>
<html lang="es" class="pagina-productos">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - VIVAE</title>
    <link rel="icon" type="image/jpg" href="img/vivae.jpg">
    <link rel="shortcut icon" type="image/jpg" href="img/vivae.jpg">
    
    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/productos.css">
</head>
<body>
    <!-- Navigation will be loaded here -->
    <div id="navbar-placeholder">
      <!-- Nav will be loaded by JavaScript -->
    </div>
    <main class="contenido-principal contenedor">
        <div class="pagina-header">
            <h1 class="titulo-pagina">Nuestros Productos</h1>
            <div class="buscador">
                <input type="text" id="buscador" placeholder="Buscar productos...">
                <span class="material-icons">search</span>
            </div>
        </div>
        
        <!-- Filtros -->
        <div class="filtros-container">
    <div class="filtros-categorias">
        <button class="filtro-btn active" data-categoria="todos">
            <span class="material-icons">dashboard</span> <span>Todos</span>
        </button>
        <button class="filtro-btn" data-categoria="blusas">
            <span class="material-icons">checkroom</span> <span>Blusas</span>
        </button>
        <button class="filtro-btn" data-categoria="conjuntos">
            <span class="material-icons">layers</span> <span>Conjuntos</span>
        </button>
        <button class="filtro-btn" data-categoria="faldas">
            <span class="material-icons">woman</span> <span>Faldas</span>
        </button>
        <button class="filtro-btn" data-categoria="licra">
            <span class="material-icons">fitness_center</span> <span>Licra</span>
        </button>
        <button class="filtro-btn" data-categoria="pantalones">
            <span class="material-icons">dry_cleaning</span> <span>Pantalones</span>
        </button>
        <button class="filtro-btn" data-categoria="vestidos">
            <span class="material-icons">face_3</span> <span>Vestidos</span>
        </button>
    </div>
</div>

        <!-- Estado de carga -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando productos...</p>
        </div>

        <!-- Mensaje de error -->
        <div id="error-container" class="error-container" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <p>No se pudieron cargar los productos. Por favor, inténtalo de nuevo más tarde.</p>
        </div>

        <!-- Sin resultados -->
        <div id="no-results" class="no-results" style="display: none;">
            <i class="fas fa-search"></i>
            <p>No se encontraron productos que coincidan con tu búsqueda.</p>
        </div>

        <!-- Contador de resultados -->
        <div id="contador-resultados" class="contador-resultados" style="display: none; text-align: center; margin: 1rem 0; font-size: 1.1rem; color: #666;">
            <!-- El contador se actualizará dinámicamente -->
        </div>

        <!-- Grid de productos -->
        <div id="products-grid" class="products-grid">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
    </main>
    <!-- Footer will be loaded here -->
    <footer id="footer-placeholder">
      <!-- Footer will be loaded by JavaScript -->
    </footer>

    <!-- Scripts -->
    <script>
    // Función para cargar la navegación
    async function cargarNavegacion() {
        try {
          const response = await fetch('includes/nav.html');
          if (!response.ok) throw new Error('No se pudo cargar la navegación');
          
          const html = await response.text();
          const nav = document.getElementById('navbar-placeholder');
          if (nav) {
            nav.innerHTML = html;
            // Inicializar menú móvil
            const menuToggle = document.querySelector('.menu-toggle');
            const mainNav = document.querySelector('.main-nav');
            const menuOverlay = document.querySelector('.menu-overlay');
            
            if (menuToggle && mainNav) {
              menuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('active');
                menuToggle.classList.toggle('active');
                menuOverlay.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
              });
            }
            
            if (menuOverlay) {
              menuOverlay.addEventListener('click', () => {
                mainNav.classList.remove('active');
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
                document.body.classList.remove('no-scroll');
              });
            }
          }
        } catch (error) {
          console.error('Error al cargar la navegación:', error);
        }
      }

      // Función para cargar el pie de página
      async function cargarFooter() {
        try {
          const response = await fetch('includes/footer.html');
          if (!response.ok) throw new Error('No se pudo cargar el pie de página');
          
          const html = await response.text();
          const footer = document.getElementById('footer-placeholder');
          if (footer) {
            footer.innerHTML = html;
          }
        } catch (error) {
          console.error('Error al cargar el pie de página:', error);
        }
      }

      // Cargar navegación y pie de página cuando el DOM esté listo
      // Inicialización de la página
      document.addEventListener('DOMContentLoaded', () => {
        console.log('Inicializando página de productos...');
        
        // Cargar navegación y pie de página
        cargarNavegacion();
        cargarFooter();
        
        // Inicializar productos
        if (window.vivae && window.vivae.productos && typeof window.vivae.productos.init === 'function') {
            window.vivae.productos.init();
        } else {
            console.error('No se pudo inicializar la página de productos');
            const errorContainer = document.getElementById('error-container');
            if (errorContainer) {
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Error al cargar los productos. Por favor, recarga la página.</p>
                    </div>`;
            }
        }
      });
      
      // Inicialización del menú móvil
      function initMobileMenu() {
        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('.main-nav');
        const menuOverlay = document.querySelector('.menu-overlay');
        
        if (menuToggle && mainNav) {
          menuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('active');
            menuToggle.classList.toggle('active');
            if (menuOverlay) menuOverlay.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
          });
        }
      }
    </script>
    
    <!-- Scripts al final del body para mejor rendimiento -->
    <script src="js/main.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
