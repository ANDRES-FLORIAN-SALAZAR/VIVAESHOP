<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos de Vivae - Encuentra las últimas tendencias en moda">
  <title>Productos - Vivae</title>
  <link rel="icon" type="image/jpg" href="img/vivae.jpg">
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Barra de navegación -->
  <div id="navbar-placeholder"></div>

  <!-- Contenido principal -->
  <main class="main-content">
    <div class="container">
      <h1 class="page-title">Nuestros Productos</h1>
      
      <!-- Filtros -->
      <div class="filters-content">
        <div class="filter-group">
          <h3 class="filter-title">Categorías</h3>
          <div class="select-container">
            <select id="category-select" class="category-select">
              <option value="">Todas las categorías</option>
              <!-- Las opciones se cargarán dinámicamente -->
            </select>
            <div class="select-arrow">
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>
        
        <div class="filter-group search-filter">
          <h3 class="filter-title">Buscar producto</h3>
            <div class="search-box">
              <i class="fas fa-search search-icon"></i>
              <input type="text" id="search" placeholder="Buscar por nombre o descripción..." class="search-input">
              <button class="clear-search" id="clear-search" aria-label="Limpiar búsqueda">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="active-filters" id="active-filters">
          <!-- Filtros activos se mostrarán aquí -->
        </div>
      </div>
      
      <div id="products-grid" class="products-grid">
        <!-- Los productos se cargarán aquí dinámicamente -->
      </div>
      
      <div id="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Cargando productos...</p>
      </div>
      
      <div id="no-results" style="display: none;">
        <i class="fas fa-search"></i>
        <h3>No se encontraron productos</h3>
        <p>Intenta con otros términos de búsqueda o filtros</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts se cargan al final del body -->
  <script src="js/config.js"></script>
  <script src="js/main-clean.js"></script>
  
  <!-- Script principal -->
  <script>
    // Función para cargar la navegación y el footer
    async function loadNavigation() {
      try {
        console.log('Cargando navegación...');
        
        // Cargar navegación y footer en paralelo
        const [navResponse, footerResponse] = await Promise.all([
          fetch('includes/nav.html'),
          fetch('includes/footer.html')
        ]);
        
        if (!navResponse.ok || !footerResponse.ok) {
          throw new Error('Error al cargar la navegación o el footer');
        }
        
        const [navHtml, footerHtml] = await Promise.all([
          navResponse.text(),
          footerResponse.text()
        ]);
        
        // Insertar la navegación
        const navbarPlaceholder = document.getElementById('navbar-placeholder');
        const footerPlaceholder = document.getElementById('footer-placeholder');
        
        if (!navbarPlaceholder || !footerPlaceholder) {
          console.error('No se encontraron los placeholders de navegación o footer');
          return false;
        }
        
        navbarPlaceholder.innerHTML = navHtml;
        footerPlaceholder.innerHTML = footerHtml;
        
        console.log('Navegación y footer cargados correctamente');
        return true;
        
      } catch (error) {
        console.error('Error al cargar la navegación:', error);
        return false;
      }
    }
    
    // Inicializar la navegación cuando el DOM esté listo
    async function initialize() {
      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve));
      }
      
      // Cargar la navegación
      const navLoaded = await loadNavigation();
      
      if (navLoaded) {
        // Inicializar menú móvil después de cargar la navegación
        setupMobileMenu();
        
        // Inicializar otros componentes
        if (typeof mostrarProductos === 'function') {
          mostrarProductos();
        }
        
        // Actualizar contador del carrito
        if (typeof actualizarContadorCarrito === 'function') {
          actualizarContadorCarrito();
        }
      } else {
        console.error('No se pudo cargar la barra de navegación');
      }
    }
    
    // Iniciar la inicialización
    initialize();
    
    // Función para el menú móvil
    function setupMobileMenu() {
      console.log('Inicializando menú móvil...');
      let menuToggle = document.getElementById('menuToggle');
      let mainNav = document.querySelector('.main-nav');
      
      if (!menuToggle || !mainNav) {
        console.error('Elementos del menú no encontrados:', {
          menuToggle: !!menuToggle,
          mainNav: !!mainNav
        });
        return;
      }
      
      // Asegurarse de que el botón de menú sea visible en móviles
      if (window.innerWidth <= 992) {
        menuToggle.style.display = 'flex';
      } else {
        menuToggle.style.display = 'none';
      }
      
      // Función para alternar el menú
      const toggleMenu = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        
        const isOpening = !mainNav.classList.contains('active');
        
        // Alternar clases
        mainNav.classList.toggle('active');
        menuToggle.classList.toggle('active');
        document.body.classList.toggle('menu-open');
        
        // Actualizar atributo aria-expanded para accesibilidad
        menuToggle.setAttribute('aria-expanded', isOpening);
        
        console.log('Menú ' + (isOpening ? 'abierto' : 'cerrado'));
      };
      
      // Eliminar manejadores de eventos previos
      const newMenuToggle = menuToggle.cloneNode(true);
      menuToggle.parentNode.replaceChild(newMenuToggle, menuToggle);
      menuToggle = newMenuToggle; // Actualizar la referencia
      
      // Agregar el manejador de eventos al nuevo botón
      menuToggle.addEventListener('click', toggleMenu);
      
      // Cerrar menú al hacer clic en un enlace de navegación
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          if (mainNav.classList.contains('active')) {
            toggleMenu();
          }
        });
      });
      
      // Cerrar menú al hacer clic fuera
      document.addEventListener('click', (e) => {
        const isClickInsideNav = mainNav.contains(e.target);
        const isClickOnToggle = menuToggle.contains(e.target);
        
        if (!isClickInsideNav && !isClickOnToggle && mainNav.classList.contains('active')) {
          toggleMenu();
        }
      });
      
      // Cerrar menú al presionar la tecla Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mainNav.classList.contains('active')) {
          toggleMenu();
        }
      });
      
      // Manejar cambios de tamaño de la ventana
      const handleResize = () => {
        if (window.innerWidth > 992) {
          // En pantallas grandes, asegurarse de que el menú esté cerrado
          if (mainNav.classList.contains('active')) {
            toggleMenu();
          }
          // Ocultar el botón de menú en pantallas grandes
          menuToggle.style.display = 'none';
        } else {
          // Mostrar el botón de menú en móviles
          menuToggle.style.display = 'flex';
        }
      };
      
      // Configurar el event listener para el redimensionamiento
      window.removeEventListener('resize', handleResize); // Eliminar duplicados
      window.addEventListener('resize', handleResize);
      
      // Asegurarse de que el estado inicial sea correcto
      handleResize();
      
      console.log('Menú móvil inicializado correctamente');
    }
    
    // Función para mostrar los productos
    async function mostrarProductos() {
      console.log('Mostrando productos...');
      const productsGrid = document.getElementById('products-grid');
      const loadingElement = document.getElementById('loading');
      const noResultsElement = document.getElementById('no-results');
      
      if (!productsGrid || !loadingElement || !noResultsElement) {
        console.error('No se encontraron elementos necesarios');
        return;
      }
      
      // Limpiar el grid de productos
      productsGrid.innerHTML = '';
      
      // Ocultar mensajes previos
      loadingElement.style.display = 'none';
      noResultsElement.style.display = 'none';
      
      // Mostrar indicador de carga solo si la carga tarda más de 300ms
      const loadingTimeout = setTimeout(() => {
        loadingElement.style.display = 'block';
      }, 300);
      
      // Función para intentar cargar los productos
      const loadProductsWithRetry = async (attempt = 1, maxAttempts = 3) => {
        try {
          // Verificar que loadProducts existe
          if (typeof window.loadProducts !== 'function') {
            throw new Error('La función loadProducts no está disponible');
          }
          
          // Cargar productos
          console.log(`[Intento ${attempt}] Llamando a loadProducts...`);
          const products = await window.loadProducts();
          
          if (!products || products.length === 0) {
            throw new Error('No se encontraron productos');
          }
          
          console.log(`[Éxito] ${products.length} productos cargados`);
          // Limpiar el timeout de carga si los productos se cargaron rápidamente
          clearTimeout(loadingTimeout);
          loadingElement.style.display = 'none';
          return products;
          
        } catch (error) {
          console.error(`[Error en el intento ${attempt}]`, error);
        
        // Mostrar mensaje de error solo en el último intento
        if (attempt >= maxAttempts) {
          loadingElement.style.display = 'none';
          noResultsElement.style.display = 'block';
          noResultsElement.innerHTML = `
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error al cargar los productos</h3>
            <p>${error.message || 'Intenta recargar la página'}</p>
            <button onclick="window.location.reload()" class="btn btn-primary" style="margin-top: 1rem;">
              <i class="fas fa-sync-alt"></i> Reintentar
            </button>`;
        }
        
        if (attempt < maxAttempts) {
            // Esperar un poco antes de reintentar
            await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
            return loadProductsWithRetry(attempt + 1, maxAttempts);
          }
          
          throw error; // Lanzar el error si se agotan los intentos
        }
      };
      
      try {
        // Intentar cargar los productos con reintentos
        const products = await loadProductsWithRetry();
        
        if (!products || products.length === 0) {
          // Ocultar indicador de carga
          loadingElement.style.display = 'none';
          
          // Mostrar mensaje de "no hay productos"
          noResultsElement.style.display = 'block';
          
          // Limpiar el grid
          productsGrid.innerHTML = '';
          return;
        }
        
        // Mostrar productos
        productsGrid.innerHTML = products.map(product => {
          // Asegurarse de que tengamos valores por defecto
          const productData = {
            id: product.id || '',
            name: product.name || 'Producto sin nombre',
            price: product.price || 0,
            image: product.image || 'img/placeholder.jpg',
            category: product.category || 'Sin categoría',
            description: product.description || 'Descripción no disponible',
            sizes: product.sizes || [],
            colors: product.colors || [],
            stock: product.stock || 0
          };

          return `
            <div class="product-card" data-category="${productData.category}" data-id="${productData.id}">
              <div class="product-image">
                <img src="${productData.image}" alt="${productData.name}" loading="lazy">
              </div>
              <div class="product-info">
                <h3>${productData.name}</h3>
                <div class="product-price">$${productData.price.toLocaleString()}</div>
                <div class="product-actions">
                  <a href="/VIVAE-SHOP/producto.html?id=${productData.id}" class="btn-view-details" data-product-id="${productData.id}">
                    <i class="fas fa-eye"></i> Ver detalles
                  </a>
                </div>
              </div>
              
              <!-- Detalles del producto (inicialmente ocultos) -->
              <div class="product-details" id="details-${productData.id}" style="display: none;">
                <div class="details-content">
                  <button class="close-details" data-id="${productData.id}" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                  </button>
                  <div class="details-info">
                    <div class="details-header">
                      <h3>${productData.name}</h3>
                      <div class="details-meta">
                        <span class="details-category">${productData.category}</span>
                        <span class="details-stock">${productData.stock > 0 ? `Disponible: ${productData.stock} unidades` : 'Agotado'}</span>
                      </div>
                      <div class="details-price">$${productData.price.toLocaleString()}</div>
                    </div>
                    
                    <div class="details-section">
                      <h4>Descripción</h4>
                      <p class="details-description">${productData.description}</p>
                    </div>
                    
                    ${productData.colors && productData.colors.length > 0 ? `
                      <div class="details-section">
                        <h4>Colores disponibles</h4>
                        <div class="color-options">
                          ${productData.colors.map(color => `
                            <span class="color-option" style="background-color: ${color.code || '#ccc'}" title="${color.name || 'Color'}" data-color="${color.code || '#ccc'}"></span>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                    
                    ${productData.sizes && productData.sizes.length > 0 ? `
                      <div class="details-section">
                        <h4>Tallas disponibles</h4>
                        <div class="size-options">
                          ${productData.sizes.map(size => `
                            <span class="size-option" data-size="${size}">${size}</span>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                    
                    <div class="details-actions">
                      <button class="btn-add-to-cart" data-id="${productData.id}" ${productData.stock <= 0 ? 'disabled' : ''}>
                        <i class="fas fa-shopping-cart"></i> 
                        ${productData.stock > 0 ? 'Añadir al carrito' : 'Sin stock'}
                      </button>
                    </div>
                    
                    <div class="details-footer">
                      <p class="shipping-info">
                        <i class="fas fa-truck"></i> Envío gratuito a todo el país
                      </p>
                      <p class="return-info">
                        <i class="fas fa-undo"></i> Devolución gratuita hasta 30 días
                      </p>
                    </div>
                  </div>
                </div>
              </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        // Actualizar contador del carrito
        actualizarContadorCarrito();
        
      } catch (error) {
        console.error('Error al cargar productos:', error);
        if (productsGrid) {
          productsGrid.innerHTML = `
            <div class="error">
              <p>Error al cargar los productos. Por favor, recarga la página.</p>
              <button onclick="window.location.reload()">Reintentar</button>
            </div>
          `;
        }
      }
    }
    
    // Función para actualizar el contador del carrito
    function actualizarContadorCarrito() {
      const contador = document.querySelector('.carrito-contador');
      if (contador && window.carrito) {
        const totalItems = window.carrito.obtenerTotalItems ? 
          window.carrito.obtenerTotalItems() : 
          (window.carrito.obtenerItems ? window.carrito.obtenerItems().length : 0);
        contador.textContent = totalItems;
        contador.style.display = totalItems > 0 ? 'flex' : 'none';
      }
    }
    
    // Función para manejar el clic en el botón de añadir al carrito
    function manejarClickAgregarCarrito(e) {
      const boton = e.target.closest('.btn-agregar-carrito');
      if (!boton) return;
      
      e.preventDefault();
      e.stopPropagation();
      
      const productId = parseInt(boton.getAttribute('data-id'));
      
      // Buscar el producto por su ID
      window.loadProducts()
        .then(products => {
          const producto = products.find(p => p.id === productId);
          if (producto) {
            // Agregar al carrito
            if (window.carrito && window.carrito.agregarItem) {
              window.carrito.agregarItem(producto);
              actualizarContadorCarrito();
              
              // Mostrar notificación
              if (window.mostrarNotificacion) {
                window.mostrarNotificacion(`"${producto.name}" añadido al carrito`, 'exito');
              } else {
                alert(`"${producto.name}" añadido al carrito`);
              }
              
              // Animar el botón
              boton.innerHTML = '<i class="fas fa-check"></i>';
              setTimeout(() => {
                if (boton.classList.contains('btn-add-to-cart')) {
                  boton.innerHTML = '<i class="fas fa-shopping-cart"></i>';
                } else {
                  boton.innerHTML = '<i class="fas fa-shopping-cart"></i> Añadido';
                  setTimeout(() => {
                    boton.innerHTML = '<i class="fas fa-shopping-cart"></i> Añadir al carrito';
                  }, 1000);
                }
              }, 1000);
            }
          }
        })
        .catch(error => {
          console.error('Error al agregar al carrito:', error);
          if (window.mostrarNotificacion) {
            window.mostrarNotificacion('Error al agregar el producto al carrito', 'error');
          } else {
            alert('Error al agregar el producto al carrito');
          }
        });
    }
    
    // Función para mostrar los detalles del producto
    function mostrarDetallesProducto(productId) {
      const modal = document.getElementById(`details-${productId}`);
      if (modal) {
        // Desplazamiento suave al inicio de la página
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
        
        // Mostrar el modal
        document.body.style.overflow = 'hidden';
        modal.style.display = 'block';
        
        // Agregar clase active después de un pequeño retraso para la animación
        setTimeout(() => {
          modal.classList.add('active');
        }, 10);
      }
    }
    
    // Función para cerrar los detalles del producto
    function cerrarDetallesProducto() {
      const modales = document.querySelectorAll('.product-details');
      modales.forEach(modal => {
        modal.classList.remove('active');
        
        // Esperar a que termine la animación antes de ocultar
        setTimeout(() => {
          modal.style.display = 'none';
          document.body.style.overflow = '';
        }, 300);
      });
    }
    
    // Función para manejar la carga de imágenes
    function handleImageLoad(img) {
      img.classList.add('loaded');
      const container = img.closest('.product-image');
      if (container) {
        container.classList.add('loaded');
      }
    }
    
    // Función para manejar la selección de tallas
    function handleSizeSelection(e) {
      const sizeOption = e.target.closest('.size-option');
      if (!sizeOption) return;
      
      // Remover la selección actual
      const parent = sizeOption.parentElement;
      parent.querySelectorAll('.size-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      // Seleccionar la talla clickeada
      sizeOption.classList.add('selected');
      
      // Actualizar el botón de añadir al carrito si es necesario
      const productCard = sizeOption.closest('.product-card');
      const addToCartBtn = productCard?.querySelector('.btn-add-to-cart');
      if (addToCartBtn) {
        addToCartBtn.disabled = false;
        addToCartBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> Añadir al carrito';
      }
    }
    
    // Inicializar cuando el DOM esté listo
    // Función para actualizar los filtros activos
    function updateActiveFilters() {
      const activeFiltersContainer = document.querySelector('.active-filters');
      if (!activeFiltersContainer) return;
      
      // Clear existing active filters
      activeFiltersContainer.innerHTML = '';
      
      // Get selected category
      const categorySelect = document.getElementById('category-filter');
      const selectedCategory = categorySelect ? categorySelect.value : 'all';
      
      // Add category filter if selected
      if (selectedCategory && selectedCategory !== 'all') {
        const filterChip = document.createElement('span');
        filterChip.className = 'filter-chip';
        filterChip.textContent = `Categoría: ${selectedCategory}`;
        
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-filter';
        removeBtn.innerHTML = '&times;';
        removeBtn.onclick = () => {
          if (categorySelect) {
            categorySelect.value = 'all';
            categorySelect.dispatchEvent(new Event('change'));
          }
        };
        
        filterChip.appendChild(removeBtn);
        activeFiltersContainer.appendChild(filterChip);
      }
      
      // Show/hide active filters container based on if there are any active filters
      activeFiltersContainer.style.display = activeFiltersContainer.children.length > 0 ? 'flex' : 'none';
    }
    
    // Función para manejar clics en la página
    function handleDocumentClick(e) {
      // Manejar clic en botón de agregar al carrito
      if (e.target.closest('.btn-add-to-cart')) {
        e.preventDefault();
        manejarClickAgregarCarrito(e);
        return;
      }
      
      // Manejar clic en botón de ver detalles
      const viewDetailsBtn = e.target.closest('.btn-view-details');
      if (viewDetailsBtn) {
        e.preventDefault();
        const productCard = viewDetailsBtn.closest('.product-card');
        if (productCard) {
          const productId = productCard.getAttribute('data-id');
          if (productId) {
            mostrarDetallesProducto(productId);
          }
        }
        return;
      }
      
      // Manejar clic en botón de cerrar detalles
      if (e.target.closest('.close-details')) {
        e.preventDefault();
        cerrarDetallesProducto();
        return;
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      // Inicializar menú móvil
      setupMobileMenu();
      
      // Mostrar productos
      mostrarProductos();
      
      // Manejar clics en la página
      document.addEventListener('click', handleDocumentClick);
      
      // Manejar la carga de imágenes
      const images = document.querySelectorAll('img[loading="lazy"]');
        images.forEach(img => {
          if (img.complete) {
            handleImageLoad(img);
          } else {
            img.addEventListener('load', () => handleImageLoad(img));
            img.addEventListener('error', () => {
              img.src = 'img/placeholder.jpg';
              handleImageLoad(img);
            });
          }
        });
      });
      
      // Manejar la selección de tallas
      document.addEventListener('click', (e) => {
        if (e.target.closest('.size-option')) {
          handleSizeSelection(e);
        }
      });
      
      // Manejar cierre de detalles del producto
      document.addEventListener('click', function(e) {
        const closeBtn = e.target.closest('.close-details');
        if (closeBtn) {
          e.preventDefault();
          cerrarDetallesProducto();
          return;
        }
        
        // Cerrar detalles al hacer clic fuera del contenido
        const modal = e.target.closest('.product-details');
        if (modal && e.target === modal) {
          cerrarDetallesProducto();
        }
      });
      
      // Cerrar con la tecla ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          cerrarDetallesProducto();
        }
      });
      
      // Manejar búsqueda
      const searchInput = document.getElementById('search');
      const clearSearch = document.getElementById('clear-search');
      
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const searchTerm = e.target.value.toLowerCase();
          const productCards = document.querySelectorAll('.product-card');
          
          productCards.forEach(card => {
            const title = card.querySelector('h3')?.textContent?.toLowerCase() || '';
            if (title.includes(searchTerm)) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
          
          if (clearSearch) {
            clearSearch.style.display = searchTerm ? 'flex' : 'none';
          }
        });
      }
      
      if (clearSearch) {
        clearSearch.addEventListener('click', () => {
          if (searchInput) {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
          }
        });
      }
      
      // Cargar categorías
      window.loadProducts()
        .then(products => {
          console.log('Productos cargados para categorías:', products);
          
          // Obtener categorías únicas, ordenadas alfabéticamente
          const categories = [...new Set(products.map(p => p.category).filter(Boolean))]
            .sort((a, b) => a.localeCompare(b));
          
          console.log('Categorías encontradas:', categories);
          
          const categorySelect = document.getElementById('category-select');
          
          if (categorySelect) {
            // Limpiar opciones existentes excepto la primera
            while (categorySelect.options.length > 1) {
              categorySelect.remove(1);
            }
            
            // Agregar categorías al select
            categories.forEach(category => {
              const option = document.createElement('option');
              option.value = category;
              option.textContent = category;
              categorySelect.appendChild(option);
            });
            
            console.log(`Se agregaron ${categories.length} categorías al menú desplegable`);
            
            // Manejar cambio de categoría
            categorySelect.addEventListener('change', (e) => {
              const selectedCategory = e.target.value;
              console.log('Categoría seleccionada:', selectedCategory);
              
              // Mostrar/ocultar productos según la categoría seleccionada
              document.querySelectorAll('.product-card').forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                // Mostrar si no hay categoría seleccionada o si la categoría coincide
                // También manejar variaciones de nombre de categoría (ej: 'Falda' vs 'Faldas')
                const shouldShow = !selectedCategory || 
                                 cardCategory === selectedCategory ||
                                 (selectedCategory === 'Falda' && cardCategory === 'Faldas') ||
                                 (selectedCategory === 'Faldas' && cardCategory === 'Falda');
                card.style.display = shouldShow ? 'block' : 'none';
              });
              
              updateActiveFilters();
            });
            // Limpiar opciones existentes (excepto la primera)
            while (categorySelect.options.length > 1) {
              categorySelect.remove(1);
            }
            
            // Agregar categorías
            categories.forEach(category => {
              const option = document.createElement('option');
              option.value = category;
              option.textContent = category;
              categorySelect.appendChild(option);
            });
            
            // Manejar cambio de categoría
            categorySelect.addEventListener('change', (e) => {
              const category = e.target.value;
              const productCards = document.querySelectorAll('.product-card');
              
              productCards.forEach(card => {
                const cardCategory = card.getAttribute('data-category') || '';
                if (!category || cardCategory === category) {
                  card.style.display = '';
                } else {
                  card.style.display = 'none';
                }
              });
            });
          }
        })
        .catch(error => {
          console.error('Error al cargar categorías:', error);
        });
    ;
  </script>
</body>
</html>
